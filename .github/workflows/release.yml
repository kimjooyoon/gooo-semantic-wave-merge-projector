name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Read immutable annotated-tag review evidence
        id: tag-evidence
        shell: bash
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_target="$(git rev-parse "$tag_ref^{}")"
          tag_message="$(git cat-file tag "$tag_ref" | sed -n '/^$/,$p')"
          reviewed_pr="$(printf '%s\n' "$tag_message" | sed -n 's/^pull_request=//p')"
          merge_sha="$(printf '%s\n' "$tag_message" | sed -n 's/^merge_sha=//p')"
          test -n "$reviewed_pr"
          test -n "$merge_sha"
          test "$merge_sha" = "$tag_target"
          printf 'reviewed_pr=%s\n' "$reviewed_pr" >> "$GITHUB_OUTPUT"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Generate and verify reviewed release projection
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/gooo-wave-output"
          mkdir -p "$output_dir"
          go run ./cmd/projector conformance \
            --source .gooo/semantic-wave-merge-projector.gooo \
            --cases fixtures/cases \
            --output "$output_dir" \
            --root "$GITHUB_WORKSPACE" \
            --reviewed-pr "${{ steps.tag-evidence.outputs.reviewed_pr }}" \
            --reviewed-merge-sha "${{ steps.tag-evidence.outputs.merge_sha }}" \
            --release-tag "$GITHUB_REF_NAME"
          tar -czf "$RUNNER_TEMP/gooo-semantic-wave-merge-projector-$GITHUB_REF_NAME.tar.gz" -C "$output_dir" .

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Reviewed implementation PR: #${{ steps.tag-evidence.outputs.reviewed_pr }}" \
            "Reviewed merge SHA: ${{ steps.tag-evidence.outputs.merge_sha }}" \
            "Bootstrap provenance: REFUTED / PR_FIRST_IMPLEMENTATION_BYPASSED / fad70e1 on main." \
            "The release contains the six caller-owned projection artifacts." > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "$RUNNER_TEMP/gooo-semantic-wave-merge-projector-$GITHUB_REF_NAME.tar.gz"
          gh release edit "$GITHUB_REF_NAME" --draft=false
