name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Read immutable annotated-tag review evidence
        id: tag-evidence
        shell: bash
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          evidence_ref="refs/tags/gooo-release-evidence-$GITHUB_RUN_ID"
          git fetch --force --no-tags origin "$tag_ref:$evidence_ref"
          tag_object="$(git rev-parse "$evidence_ref")"
          tag_type="$(git cat-file -t "$tag_object")"
          tag_target="$(git rev-parse "$evidence_ref^{}")"
          tag_payload="$(git cat-file tag "$tag_object")"
          reviewed_pr="$(printf '%s\n' "$tag_payload" | awk -F= '$1 == "pull_request" { print substr($0, index($0, "=") + 1); exit }')"
          merge_sha="$(printf '%s\n' "$tag_payload" | awk -F= '$1 == "merge_sha" { print substr($0, index($0, "=") + 1); exit }')"
          reviewed_pr_present=false
          merge_sha_present=false
          comparison_result=missing
          if test -n "$reviewed_pr"; then
            reviewed_pr_present=true
          fi
          if test -n "$merge_sha"; then
            merge_sha_present=true
          fi
          if test "$merge_sha_present" = true; then
            comparison_result=mismatch
            if test "$merge_sha" = "$tag_target"; then
              comparison_result=match
            fi
          fi
          printf 'tag_object_type=%s\n' "$tag_type"
          printf 'tag_object_sha=%s\n' "$tag_object"
          printf 'tag_target_sha=%s\n' "$tag_target"
          printf 'reviewed_pr_present=%s\n' "$reviewed_pr_present"
          printf 'merge_sha_present=%s\n' "$merge_sha_present"
          printf 'merge_target_comparison=%s\n' "$comparison_result"
          test "$tag_type" = tag
          test -n "$reviewed_pr"
          test -n "$merge_sha"
          test "$merge_sha" = "$tag_target"
          printf 'reviewed_pr=%s\n' "$reviewed_pr" >> "$GITHUB_OUTPUT"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Generate and verify reviewed release projection
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/gooo-wave-output"
          mkdir -p "$output_dir"
          go run ./cmd/projector conformance \
            --source .gooo/semantic-wave-merge-projector.gooo \
            --cases fixtures/cases \
            --output "$output_dir" \
            --root "$GITHUB_WORKSPACE" \
            --reviewed-pr "${{ steps.tag-evidence.outputs.reviewed_pr }}" \
            --reviewed-merge-sha "${{ steps.tag-evidence.outputs.merge_sha }}" \
            --release-tag "$GITHUB_REF_NAME"
          tar -czf "$RUNNER_TEMP/gooo-semantic-wave-merge-projector-$GITHUB_REF_NAME.tar.gz" -C "$output_dir" .

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Reviewed implementation PR: #${{ steps.tag-evidence.outputs.reviewed_pr }}" \
            "Reviewed merge SHA: ${{ steps.tag-evidence.outputs.merge_sha }}" \
            "Bootstrap provenance: REFUTED / PR_FIRST_IMPLEMENTATION_BYPASSED / fad70e1 on main." \
            "The release contains the six caller-owned projection artifacts." > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "$RUNNER_TEMP/gooo-semantic-wave-merge-projector-$GITHUB_REF_NAME.tar.gz"
          gh release edit "$GITHUB_REF_NAME" --draft=false
